
name: Windows build (Ribbon)

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build CADCraft
        shell: pwsh
        run: cargo build --release --locked -p cadcraft --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $out = 'dist\CADCraft-windows-x64-ribbon'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          if (!(Test-Path 'target\x86_64-pc-windows-msvc\release\cadcraft.exe')) {
            throw 'cadcraft.exe was not found after building.'
          }
          Copy-Item 'target\x86_64-pc-windows-msvc\release\cadcraft.exe' $out
          Compress-Archive -Path "$out\*" -DestinationPath 'dist\CADCraft-windows-x64-ribbon.zip' -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CADCraft-windows-x64-ribbon
          path: dist/CADCraft-windows-x64-ribbon.zip
          if-no-files-found: error
