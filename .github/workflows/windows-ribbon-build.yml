```yaml
name: Windows build (Ribbon)

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Also run tests after building"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Build CADCraft
        shell: pwsh
        run: cargo build --release --locked -p cadcraft --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $out = 'dist\CADCraft-windows-x64-ribbon'
          New-Item -ItemType Directory $out -Force | Out-Null
          Copy-Item 'target\x86_64-pc-windows-msvc\release\cadcraft.exe' $out
          Compress-Archive -Path $out -DestinationPath 'dist\CADCraft-windows-x64-ribbon.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: CADCraft-windows-x64-ribbon
          path: dist/CADCraft-windows-x64-ribbon.zip
          if-no-files-found: error
```
